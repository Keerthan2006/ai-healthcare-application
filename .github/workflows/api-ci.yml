name: API CI

on:
  push:
    branches:
      - main
    paths:
      - "services/api/**"
      - ".github/workflows/api-ci.yml"

  pull_request:
    branches:
      - main
    paths:
      - "services/api/**"
      - ".github/workflows/api-ci.yml"

  workflow_dispatch:

permissions:
  contents: read

jobs:
  api-ci:
    name: API CI
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Gitleaks
        run: apt update && apt install gitleaks

      - name: Run Gitleaks
        run: |
          gitleaks detect \
            --source . \
            --redact \
            --verbose \
            --exit-code 1

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: services/api/requirements.txt

      - name: Install dependencies
        working-directory: services/api
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest ruff

      - name: Run Ruff
        working-directory: services/api
        run: |
          ruff check .

      - name: Run tests
        working-directory: services/api
        env:
          PYTHONPATH: .
          REDIS_HOST: localhost
          REDIS_PORT: 6379
          POSTGRES_HOST: localhost
          POSTGRES_PORT: 5432
          POSTGRES_USER: ${{ vars.DATABASE_USER }}
          POSTGRES_PASSWORD: ${{ secrets.DATABASE_PASSWORD }}
          POSTGRES_DB: ${{ vars.DATABASE_DB }}
          AI_SERVICE_URL: http://localhost:8001
        run: |
          pytest