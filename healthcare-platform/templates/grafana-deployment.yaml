apiVersion: apps/v1
kind: Deployment

metadata:
  name: grafana
  namespace: healthcare

spec:
  replicas: 1

  selector:
    matchLabels:
      app: grafana

  template:
    metadata:
      labels:
        app: grafana

    spec:
      containers:
        - name: grafana
          image: grafana/grafana:13.0.1
          imagePullPolicy: IfNotPresent

          ports:
            - containerPort: 3000
              protocol: TCP

          resources:
            requests:
              cpu: "100m"
              memory: "512Mi"

            limits:
              cpu: "500m"
              memory: "1000Mi"

          readinessProbe:
            httpGet:
              path: /api/health
              port: 3000
            initialDelaySeconds: 10
            periodSeconds: 10

          livenessProbe:
            httpGet:
              path: /api/health
              port: 3000
            initialDelaySeconds: 30
            periodSeconds: 20

          volumeMounts:
            - name: grafana-data
              mountPath: /var/lib/grafana

      volumes:
        - name: grafana-data
          emptyDir: {}