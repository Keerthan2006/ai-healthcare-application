apiVersion: apps/v1
kind: Deployment
metadata:
  name: ai-service
  namespace: healthcare
  labels:
    app: ai-service

spec:
  replicas: {{ .Values.replicas.aiService }}

  selector:
    matchLabels:
      app: ai-service

  template:
    metadata:
      labels:
        app: ai-service

    spec:
      containers:
        - name: ai-service
         replicas: {{ .Values.replicas.aiService }}

          ports:
            - containerPort: 8001

          livenessProbe:
            httpGet:
              path: /health
              port: 8001
            initialDelaySeconds: 10
            periodSeconds: 10

          readinessProbe:
            httpGet:
              path: /health
              port: 8001
            initialDelaySeconds: 10
            periodSeconds: 5

          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"

            limits:
              cpu: "500m"
              memory: "256Mi"

          securityContext:
            allowPrivilegeEscalation: false
            runAsNonRoot: true
            capabilities:
              drop:
                - ALL