services:

  postgres:
    image: postgres:16-alpine
    container_name: healthcare-postgres

    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}

    volumes:
      - postgres_data:/var/lib/postgresql/data

    networks:
      - backend


  redis:
    image: redis:7-alpine
    container_name: healthcare-redis

    networks:
      - backend


  ai-service:
    build:
      context: ./services/ai-service

    container_name: healthcare-ai

    environment:
      FAILURE_MODE: ${FAILURE_MODE}

    networks:
      - backend


  mock-ehr:
    build:
      context: ./services/mock-ehr

    container_name: healthcare-ehr

    environment:
      EHR_FAILURE_MODE: ${EHR_FAILURE_MODE}

    networks:
      - backend


  worker:
    build:
      context: ./services/worker

    container_name: healthcare-worker

    environment:
      REDIS_HOST: ${REDIS_HOST}
      REDIS_PORT: ${REDIS_PORT}

      POSTGRES_HOST: ${POSTGRES_HOST}
      POSTGRES_PORT: ${POSTGRES_PORT}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}

      EHR_SERVICE_URL: ${EHR_SERVICE_URL}

      PROCESSING_TIME: ${PROCESSING_TIME}
      MAX_ATTEMPTS: ${MAX_ATTEMPTS}

    depends_on:
      - redis
      - postgres
      - mock-ehr

    networks:
      - backend


  api:
    build:
      context: ./services/api

    container_name: healthcare-api

    environment:
      REDIS_HOST: ${REDIS_HOST}
      REDIS_PORT: ${REDIS_PORT}

      POSTGRES_HOST: ${POSTGRES_HOST}
      POSTGRES_PORT: ${POSTGRES_PORT}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}

      AI_SERVICE_URL: ${AI_SERVICE_URL}

    depends_on:
      - postgres
      - redis
      - ai-service

    ports:
      - "8000:8000"

    networks:
      - backend


volumes:
  postgres_data:


networks:
  backend: